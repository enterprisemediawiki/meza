---
- name: "Check if {{ m_simplesamlphp_path }} exists"
  stat:
    path: "{{ m_simplesamlphp_path }}"
  register: simplesamlphp_exists

- name: Remove Extension:SimpleSamlAuth, Meza now uses Extension:SimpleSAMLphp
  file:
    path: "{{ m_mediawiki }}/extensions/SimpleSamlAuth"
    state: absent

- name: "Check if SAML MW extension exists"
  stat:
    path: "{{ m_mediawiki }}/extensions/SimpleSAMLphp"
  register: simplesamlextension_exists

- name: Ensure good permissions on simplesamlphp directory and subs (if dir exists)
  file:
    path: "{{ m_simplesamlphp_path }}"
    owner: "{{ m_simplesamlphp_owner }}"
    group: "{{ m_simplesamlphp_group }}"
    mode: "{{ m_simplesamlphp_mode }}"
    recurse: yes
  when: simplesamlphp_exists.stat.exists and simplesamlphp_exists.stat.isdir

- name: Ensure good permissions on Extension:SimpleSAMLphp directory and subs (if dir exists)
  file:
    path: "{{ m_mediawiki }}/extensions/SimpleSAMLphp"
    mode: "{{ m_htdocs_mode }}"
    owner: "{{ m_htdocs_owner }}"
    group: "{{ m_htdocs_group }}"
    recurse: yes
  when: simplesamlphp_exists.stat.exists and simplesamlphp_exists.stat.isdir

- name: "Create {{ m_simplesamlphp_path }} if it doesn't exist"
  file:
    path: "{{ m_simplesamlphp_path }}"
    state: directory
    owner: "{{ m_simplesamlphp_owner }}"
    group: "{{ m_simplesamlphp_group }}"
    mode: "{{ m_simplesamlphp_mode }}"

- name: Check if SimpleSAMLphp is already installed
  stat:
    path: "{{ m_simplesamlphp_path }}/composer.json"
  register: simplesamlphp_composer

- name: Check current SimpleSAMLphp version if installed
  shell: |
    if [ -f "{{ m_simplesamlphp_path }}/composer.lock" ]; then
      grep -A 3 '"name": "simplesamlphp/simplesamlphp"' {{ m_simplesamlphp_path }}/composer.lock | grep '"version"' | head -1 | cut -d'"' -f4 | sed 's/^v//'
    else
      echo "not_installed"
    fi
  register: current_ssp_version
  changed_when: false
  when: simplesamlphp_composer.stat.exists

- name: Set fact for SimpleSAMLphp upgrade
  set_fact:
    simplesamlphp_will_upgrade: "{{ simplesamlphp_composer.stat.exists and current_ssp_version.stdout != simplesamlphp_version }}"

- name: Remove SimpleSAMLphp directory for fresh install (if wrong version or missing)
  file:
    path: "{{ m_simplesamlphp_path }}"
    state: absent
  when: 
    - simplesamlphp_composer.stat.exists
    - current_ssp_version.stdout != simplesamlphp_version

- name: Recreate SimpleSAMLphp directory
  file:
    path: "{{ m_simplesamlphp_path }}"
    state: directory
    owner: "{{ m_simplesamlphp_owner }}"
    group: "{{ m_simplesamlphp_group }}"
    mode: "{{ m_simplesamlphp_mode }}"

- name: Install SimpleSAMLphp {{ simplesamlphp_version }} via Composer
  become: yes
  become_user: "{{ m_simplesamlphp_owner }}"
  composer:
    command: create-project
    arguments: simplesamlphp/simplesamlphp:{{ simplesamlphp_version }} .
    working_dir: "{{ m_simplesamlphp_path }}"
    no_dev: no
  when: not simplesamlphp_composer.stat.exists or current_ssp_version.stdout != simplesamlphp_version

- name: Ensure required SimpleSAMLphp directories exist
  file:
    path: "{{ m_simplesamlphp_path }}/{{ item }}"
    state: directory
    owner: "{{ m_simplesamlphp_owner }}"
    group: "{{ m_simplesamlphp_group }}"
    mode: "0755"
  loop:
    - config
    - metadata
    - log
    - cache
    - cert

- name: Ensure log directory is writable
  file:
    path: "{{ m_simplesamlphp_path }}/log"
    state: directory
    owner: "{{ m_simplesamlphp_owner }}"
    group: "{{ m_simplesamlphp_group }}"
    mode: "0775"

- name: Ensure cache directory is writable
  file:
    path: "{{ m_simplesamlphp_path }}/cache"
    state: directory
    owner: "{{ m_simplesamlphp_owner }}"
    group: "{{ m_simplesamlphp_group }}"
    mode: "0775"

- name: Ensure Extension:PluggableAuth installed
  become: yes
  become_user: "meza-ansible"
  # Ref #1149 for TMPDIR environment var
  environment:
    TMPDIR: "{{ m_tmp }}"
  git:
    repo: https://github.com/wikimedia/mediawiki-extensions-PluggableAuth.git
    dest: "{{ m_mediawiki }}/extensions/PluggableAuth"
    version: "tags/7.5.0" # "{{ saml_mw_extension_version }}"
    umask: "0002"
  tags:
    - latest

- name: Ensure Extension:SimpleSAMLphp (MediaWiki extension) installed
  become: yes
  become_user: "meza-ansible"
  # Ref #1149 for TMPDIR environment var
  environment:
    TMPDIR: "{{ m_tmp }}"
  git:
    repo: https://github.com/wikimedia/mediawiki-extensions-SimpleSAMLphp.git
    dest: "{{ m_mediawiki }}/extensions/SimpleSAMLphp"
    version: "tags/7.0.0" # "{{ saml_mw_extension_version }}"
    umask: "0002"
  tags:
    - latest

- name: Ensure ./config directory in place
  file:
    path: "{{ m_simplesamlphp_path }}/config"
    state: directory

- name: Ensure ./metadata directory in place
  file:
    path: "{{ m_simplesamlphp_path }}/metadata"
    state: directory

- name: Ensure config files in place
  template:
    src: "{{ item.filename }}.j2"
    dest: "{{ item.dest_path }}/{{ item.filename }}"
  with_items:
    # Config files for SimpleSamlPhp (PHP SAML library)
    - filename: "config.php"
      dest_path: "{{ m_simplesamlphp_path }}/config"
    - filename: "saml20-idp-remote.php"
      dest_path: "{{ m_simplesamlphp_path }}/metadata"
    - filename: "authsources.php"
      dest_path: "{{ m_simplesamlphp_path }}/config"

    # Config files for SimpleSamlAuth (MediaWiki extension)
    - filename: "samlLocalSettings.php"
      dest_path: "{{ m_deploy }}"

    # Config file used by MW extension + any other PHP app needing auth
    # (landing page, admin functions, etc)
    - filename: "SAMLConfig.php"
      dest_path: "{{ m_deploy }}"

- name: Ensure _still_ good permissions on simplesamlphp directory and subs
  file:
    path: "{{ m_simplesamlphp_path }}"
    owner: "{{ m_simplesamlphp_owner }}"
    group: "{{ m_simplesamlphp_group }}"
    mode: "{{ m_simplesamlphp_mode }}"
    recurse: yes

- name: Ensure _still_ good permissions on Extension:SimpleSamlAuth directory and subs
  file:
    path: "{{ m_mediawiki }}/extensions/SimpleSamlAuth"
    mode: "{{ m_htdocs_mode }}"
    owner: "{{ m_htdocs_owner }}"
    group: "{{ m_htdocs_group }}"
    recurse: yes

- name: Ensure NonMediaWikiSimpleSamlAuth.php in place
  template:
    src: NonMediaWikiSimpleSamlAuth.php.j2
    dest: "{{ m_htdocs }}/NonMediaWikiSimpleSamlAuth.php"
    owner: meza-ansible
    group: apache
    mode: 0755

- name: Trigger memcached restart after SimpleSAMLphp upgrade
  debug:
    msg: "SimpleSAMLphp was upgraded, memcached needs restart"
  changed_when: simplesamlphp_will_upgrade or not simplesamlphp_composer.stat.exists
  notify:
    - restart memcached