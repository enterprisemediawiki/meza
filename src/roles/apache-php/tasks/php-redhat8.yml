---
- name: Remove IUS Repo since we're at distro 8+
  package:
    name: "ius-release"
    state: absent

- name: Remove PHP 5.x packages
  package:
    lock_timeout: 180 # wait up to 3 minutes for a lock ansible/ansible#57189
    name: "php5*"
    state: absent

- name: Switch to php 7.4
  shell: dnf -y module switch-to php:7.4

- name: Ensure PHP packages for Rocky/RHEL8 installed
  package:
    name:
      - php-cli
      - php-common
      - php-devel
      - php-gd
      - php-json
      - php-snmp
      - php-xml
      - php-xmlrpc
      - php-mysqlnd
      - php-pdo
      - php-odbc
      - php-process
      - php-bcmath
      - php-intl
      - php-opcache
      - php-soap
      - php-mbstring
      - php-ldap
      - php-fpm
      - php-pear
    state: present

- name: install libmemcached-devel
  dnf:
    name: libmemcached-devel
    enablerepo: devel

# PHP memcached extension needed for SAML auth
- name: Ensure PEAR channel up-to-date
  shell: pear channel-update pecl.php.net

- name: Check if memcached.so exists
  stat:
    path: /usr/lib64/php/modules/memcached.so
  register: memcached_so

- name: Reinstall memcached if .so file missing
  block:
    - name: Uninstall existing memcached PECL package
      shell: pecl uninstall memcached
      ignore_errors: true
    
    # --configureoptions parameter is not supported in all versions of pecl.
    - name: Install memcached PECL packages
      shell: >
        printf 'no\nno\nno\nno\nno\nno\nno\nyes\nyes\n' |
        pecl install memcached
  when: not memcached_so.stat.exists
  notify:
    - restart apache
    - restart php-fpm

- template:
    src: 40-memcached.ini.j2
    dest: /etc/php.d/40-memcached.ini
    owner: root
    group: root
    mode: 0644
  notify:
    - restart apache
    - restart php-fpm
