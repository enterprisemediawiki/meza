---
- name: Remove IUS Repo since we're at distro 8+
  package:
    name: "ius-release"
    state: absent

- name: Remove PHP 5.x packages
  package:
    lock_timeout: 180 # wait up to 3 minutes for a lock ansible/ansible#57189
    name: "php5*"
    state: absent

- name: Reset PHP module before switching versions
  shell: dnf -y module reset php
  when: php_debian_version != '7.4'

- name: Remove old PHP packages before version switch
  package:
    lock_timeout: 180
    name:
      - php
      - php-cli
      - php-common
      - php-devel
      - php-gd
      - php-json
      - php-snmp
      - php-xml
      - php-xmlrpc
      - php-mysqlnd
      - php-pdo
      - php-odbc
      - php-process
      - php-bcmath
      - php-intl
      - php-opcache
      - php-soap
      - php-mbstring
      - php-ldap
      - php-fpm
      - php-pear
    state: absent
  when: php_debian_version != '7.4'

- name: Switch to php {{ php_debian_version }}
  shell: dnf -y module switch-to php:{{ php_debian_version }}

- name: Ensure PHP packages for Rocky/RHEL8 installed
  package:
    name:
      - php-cli
      - php-common
      - php-devel
      - php-gd
      # - php-json  # Removed - not available in PHP 8.x (built-in)
      - php-snmp
      - php-xml
      # - php-xmlrpc  # Removed - not available in PHP 8.x
      - php-mysqlnd
      - php-pdo
      - php-odbc
      - php-process
      - php-bcmath
      - php-intl
      - php-opcache
      - php-soap
      - php-mbstring
      - php-ldap
      - php-fpm
      - php-pear
    state: present

- name: install libmemcached-devel
  dnf:
    name: libmemcached-devel
    enablerepo: devel

# PHP memcached extension needed for SAML auth
- name: Ensure PEAR channel up-to-date
  shell: pear channel-update pecl.php.net

- name: Check if memcached.so exists
  stat:
    path: /usr/lib64/php/modules/memcached.so
  register: memcached_so

- name: Check if memcached extension loads without errors
  shell: php -d display_errors=on -d display_startup_errors=on -m 2>&1 | grep -q "^memcached$"
  register: memcached_loads
  failed_when: false
  changed_when: false

- name: Reinstall memcached if missing or incompatible
  block:
    - name: Remove old memcached.so before reinstalling
      file:
        path: /usr/lib64/php/modules/memcached.so
        state: absent
    
    - name: Uninstall existing memcached PECL package
      shell: pecl uninstall memcached
      ignore_errors: true
    
    # --configureoptions parameter is not supported in all versions of pecl.    
    - name: Install memcached PECL packages
      shell: >
        printf 'no\nno\nno\nno\nno\nno\nno\nyes\nyes\n' |
        pecl install memcached
  when: not memcached_so.stat.exists or memcached_loads.rc != 0

- name: Trigger restart if memcached was reinstalled
  debug:
    msg: "Memcached was reinstalled"
  changed_when: not memcached_so.stat.exists or memcached_loads.rc != 0
  notify:
    - restart apache
    - restart php-fpm

- template:
    src: 40-memcached.ini.j2
    dest: /etc/php.d/40-memcached.ini
    owner: root
    group: root
    mode: 0644
  notify:
    - restart apache
    - restart php-fpm
